name: v2

on:
  pull_request:
    paths: ['v2/**', '.github/workflows/v2.yml']
  push:
    branches: [main, v2-bun-stack]
    paths: ['v2/**', '.github/workflows/v2.yml']

defaults:
  run:
    working-directory: v2

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sellit
          POSTGRES_PASSWORD: sellit
          POSTGRES_DB: sellit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sellit" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests API
        run: bun test
        working-directory: v2/apps/api
        env:
          TEST_DATABASE_URL: postgres://sellit:sellit@localhost:5432/sellit_test
      - name: Build dashboard
        run: bun run build
        working-directory: v2/apps/dashboard
      - name: Build storefront
        run: bun run build
        working-directory: v2/apps/storefront

  # Déploiement uniquement depuis main.
  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: v2
          file: v2/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sellit-api:latest
            ghcr.io/${{ github.repository }}/sellit-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Deux services Dokploy sur la même image : l'API (commande par défaut) et le worker (bun src/worker.ts).
      - name: Redéployer l'API
        run: curl -sSf -X POST "${{ secrets.DOKPLOY_WEBHOOK_API_V2 }}"
      - name: Redéployer le worker
        run: curl -sSf -X POST "${{ secrets.DOKPLOY_WEBHOOK_WORKER_V2 }}"

  deploy-edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build dashboard + déployer le Worker
        run: bun run deploy
        working-directory: v2/apps/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-storefront:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build + déployer le storefront
        run: bun run deploy
        working-directory: v2/apps/storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
