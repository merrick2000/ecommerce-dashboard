# Zuri — services serveur (Dokploy, application de type « Compose »).
#
# - Un push sur la branche suivie → Dokploy reconstruit l'image et redémarre.
# - L'API et le worker partagent la MÊME image (un seul build).
# - La base PostgreSQL est un service Dokploy séparé (sauvegardes intégrées) :
#   son URL est fournie via DATABASE_URL dans les variables d'environnement.
# - Le dashboard et les boutiques sont sur Cloudflare (hors de ce fichier).
#
# Variables à définir dans Dokploy (onglet Environment) : voir v2/apps/api/.env.example.
# Dokploy : Compose Path = ./docker-compose.yml (racine du dépôt).

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-https://app.zurisell.store}
  STOREFRONT_URL: ${STOREFRONT_URL:-https://zurisell.store}
  BASE_DOMAIN: ${BASE_DOMAIN:-zurisell.store}
  EDGE_SECRET: ${EDGE_SECRET}
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  MAIL_FROM: ${MAIL_FROM:-Zuri <noreply@zurisell.store>}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  LEGACY_DATABASE_URL: ${LEGACY_DATABASE_URL:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  api:
    build:
      # Le code v2 vit dans le dossier v2/ du dépôt.
      context: ./v2
      dockerfile: Dockerfile.api
    image: zuri-api:latest
    restart: unless-stopped
    environment: *api-env
    # Les migrations s'exécutent au démarrage de l'API (commande par défaut de l'image).
    expose:
      - '8787'
    # Réseau partagé Dokploy : accès à la base (service séparé) et au proxy Traefik pour le domaine.
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: zuri-api:latest
    restart: unless-stopped
    environment: *api-env
    command: ['bun', 'src/worker.ts']
    networks:
      - default
      - dokploy-network
    # Pas de serveur HTTP dans le worker : on désactive le contrôle de santé hérité de l'image.
    healthcheck:
      disable: true
    # Démarre après l'API : les migrations sont alors appliquées.
    depends_on:
      api:
        condition: service_healthy

networks:
  dokploy-network:
    external: true
